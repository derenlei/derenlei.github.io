<style>

:root {
  --bg: #0d1117;
  --bg-surface: #0d1117;
  --bg-header: #010409;
  --border: #21262d;
  --text: #c9d1d9;
  --text-muted: #8b949e;
  --green: #10b981;
  --green-dim: #065f46;
  --accent: #10b981;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --bg-surface: #ffffff;
  --bg-header: #f0f2f5;
  --border: #d0d7de;
  --text: #1f2328;
  --text-muted: #656d76;
  --green: #0e7a52;
  --green-dim: #dafbe1;
  --accent: #0e7a52;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--font-mono);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background .3s, color .3s;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── HEADER BAR ─────────────────────────────────────────────────────── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 2rem;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 56px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.header-name {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
}
.header-sep {
  color: var(--border);
  font-size: 0.9rem;
}
.header-title {
  font-size: 0.9rem;
  color: var(--text-muted);
}
.header-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.social-links {
  display: flex;
  gap: 0.8rem;
  align-items: center;
}
.social-links a {
  color: var(--text-muted);
  display: flex;
  align-items: center;
  transition: color .2s;
}
.social-links a:hover { color: var(--accent); text-decoration: none; }
.social-links svg { width: 20px; height: 20px; fill: currentColor; }

.theme-toggle {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* ── TERMINAL ───────────────────────────────────────────────────────── */
.terminal-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: stretch;
  padding: 1.5rem 2rem 2rem;
  min-height: 0;
}
.terminal {
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-width: 1000px;
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.terminal-titlebar {
  display: flex;
  align-items: center;
  padding: 0.6rem 1rem;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  position: relative;
}
.terminal-dots {
  display: flex;
  gap: 6px;
}
.terminal-dots span {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.terminal-dots span:nth-child(1) { background: #ff5f57; }
.terminal-dots span:nth-child(2) { background: #febc2e; }
.terminal-dots span:nth-child(3) { background: #28c840; }
.terminal-titlebar-text {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.75rem;
  color: var(--text-muted);
}
.terminal-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 1.5rem 2rem;
  font-size: 0.875rem;
  line-height: 1.75;
  background: var(--bg-surface);
}
.terminal-body::-webkit-scrollbar { width: 8px; }
.terminal-body::-webkit-scrollbar-track { background: transparent; }
.terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.terminal-body::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.prompt-line { color: var(--accent); }
.cmd-text { color: var(--text); }
.output-text { color: var(--text-muted); white-space: pre-wrap; }
.output-text .highlight { color: var(--accent); font-weight: 600; }

/* Input area */
.input-row {
  display: flex;
  align-items: center;
  margin-top: 0.5rem;
}
.input-prompt {
  color: var(--accent);
  white-space: nowrap;
  margin-right: 0.5rem;
}
.cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.875rem;
  caret-color: var(--accent);
}
.cmd-input::placeholder { color: var(--border); }

/* Cursor blink */
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.cursor-blink {
  display: inline-block;
  width: 8px;
  height: 1.1em;
  background: var(--accent);
  animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
  margin-left: 1px;
}

/* ── RESPONSIVE ─────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .site-header { padding: 0.5rem 1rem; }
  .terminal-body { padding: 1rem; font-size: 0.8rem; }
  .header-name { font-size: 0.8rem; }
  .header-title { display: none; }
}

</style>
</head>

      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: chatHistory
      })
    }).then(function(res) {
      if (!res.ok) {
        tryModel(modelIndex + 1, cb);
        return;
      }
      return res.json();
    }).then(function(data) {
      if (!data) return;
      var reply = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || "No response.";
      cb(reply);
    }).catch(function() {
      tryModel(modelIndex + 1, cb);
    });
  }

  function askGemini(question, cb) {
    chatHistory.push({ role: "user", parts: [{ text: question }] });
    tryModel(0, function(reply) {
      chatHistory.push({ role: "model", parts: [{ text: reply }] });
      cb(reply);
    });
  }

  function addPromptLine(cmd) {
    var div = document.createElement("div");
    var p = document.createElement("span");
    p.className = "prompt-line";
    p.textContent = "deren.lei ~ $ ";
    var c = document.createElement("span");
    c.className = "cmd-text";
    c.textContent = cmd;
    div.appendChild(p);
    div.appendChild(c);
    output.appendChild(div);
  }

  function typeOutput(text, cb) {
    var div = document.createElement("div");
    div.className = "output-text";
    output.appendChild(div);
    var lines = text.split("\n");
    var li = 0;
    function nextLine() {
      if (li >= lines.length) {
        if (cb) cb();
        return;
      }
      if (li > 0) div.appendChild(document.createElement("br"));
      var span = document.createElement("span");
      span.textContent = lines[li];
      div.appendChild(span);
      li++;
      scrollBottom();
      setTimeout(nextLine, 22);
    }
    nextLine();
  }

  function scrollBottom() {
    var body = document.querySelector(".terminal-body");
    body.scrollTop = body.scrollHeight;
  }

  function processCommand(cmd) {
    addPromptLine(cmd);
    var resp = respond(cmd);
    if (resp === "__CLEAR__") {
      while (output.firstChild) output.removeChild(output.firstChild);
      return;
    }
    if (resp === null) {
      // Not a built-in command — ask Gemini
      inputRow.style.display = "none";
      var thinkDiv = document.createElement("div");
      thinkDiv.className = "output-text";
      thinkDiv.textContent = "Thinking...";
      output.appendChild(thinkDiv);
      scrollBottom();
      askGemini(cmd, function(reply) {
        output.removeChild(thinkDiv);
        typeOutput(reply, function() {
          var spacer = document.createElement("div");
          spacer.style.height = "0.75rem";
          output.appendChild(spacer);
          inputRow.style.display = "flex";
          inputEl.focus();
          scrollBottom();
        });
      });
      return;
    }
    inputRow.style.display = "none";
    typeOutput(resp, function() {
      var spacer = document.createElement("div");
      spacer.style.height = "0.75rem";
      output.appendChild(spacer);
      inputRow.style.display = "flex";
      inputEl.focus();
      scrollBottom();
    });
  }

  function bootSequence() {
    var lines = [
      "Welcome to deren.lei \u2014 interactive terminal",
      "",
      "Hi! I'm Deren's AI assistant.",
      "Ask me anything about his research, publications, or experience.",
      "",
      "Type 'help' for available commands.",
      ""
    ];
    var container = document.createElement("div");
    container.className = "output-text";
    output.appendChild(container);
    var i = 0;
    function next() {
      if (i >= lines.length) {
        inputRow.style.display = "flex";
        inputEl.focus();
        scrollBottom();
        return;
      }
      if (i > 0) container.appendChild(document.createElement("br"));
      var sp = document.createElement("span");
      if (i === 0) sp.style.color = "var(--accent)";
      sp.textContent = lines[i];
      container.appendChild(sp);
      i++;
      scrollBottom();
      setTimeout(next, i === 1 ? 300 : 50);
    }
    inputRow.style.display = "none";
    setTimeout(next, 400);
  }

  function initTheme() {
    var btn = document.getElementById("theme-toggle");
    var html = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch(e) {}
    if (saved === "light") {
      html.setAttribute("data-theme", "light");
      btn.textContent = "> light_mode";
    }
    btn.addEventListener("click", function() {
      var cur = html.getAttribute("data-theme");
      if (cur === "light") {
        html.removeAttribute("data-theme");
        btn.textContent = "> dark_mode";
        try { localStorage.setItem("theme", "dark"); } catch(e) {}
      } else {
        html.setAttribute("data-theme", "light");
        btn.textContent = "> light_mode";
        try { localStorage.setItem("theme", "light"); } catch(e) {}
      }
    });
  }

  document.addEventListener("DOMContentLoaded", function() {
    output = document.getElementById("terminal-output");
    inputEl = document.getElementById("cmd-input");
    inputRow = document.getElementById("input-row");

    initTheme();
    bootSequence();

    inputEl.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        var val = inputEl.value;
        history.unshift(val);
        histIdx = -1;
        inputEl.value = "";
        processCommand(val);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (histIdx < history.length - 1) { histIdx++; inputEl.value = history[histIdx]; }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (histIdx > 0) { histIdx--; inputEl.value = history[histIdx]; }
        else if (histIdx === 0) { histIdx = -1; inputEl.value = ""; }
      }
    });

    document.querySelector(".terminal-body").addEventListener("click", function() {
      inputEl.focus();
    });
  });
})();
</script>
